<!DOCTYPE html>
<html lang="ko" data-bs-theme="light">
    <!--
      Demo / dev shell for the React map browser bundle.

      This is exactly the structure a host page needs: a #root mount point,
      optional `window.MAP_CONFIG` settings, and the bundle. `yarn dev` serves
      this file via Vite and loads the app via ./main.tsx (which imports ../src/main);
      a production host would instead use
      <script src="index.min.js"></script> (see README "Required page structure").

      CSS (Bootstrap + app styles + flag sprite) is bundled by the app itself — in
      dev it's injected by Vite; a production host links dist/index.min.css instead.
      Translations (Korean + Polish + English) are bundled too; only the favicon comes from
      the live deployment.
    -->
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
        <meta name="theme-color" content="#0a0a0f" />
        <title>Mudlet Map Viewer</title>
        <!-- Lay the React tree out as if its children were direct children of <body>. -->
        <style>
            #root {
                display: contents;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <!-- Host configuration must run before the app module below. -->
        <script>
            window.MAP_CONFIG = {
                // Add a map URL here to load a hosted map automatically.
            };
        </script>
        <script type="module" src="./main.tsx"></script>
    </body>
</html>
